<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚖️</text></svg>">
<script>
/* Ustawiane przed narysowaniem strony, żeby nie było błysku złym motywem. */
(function(){try{var t=localStorage.getItem("orzecznik:motyw");
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
}catch(e){}})();
</script>
</head>
<body>
{% from "_icons.html" import icon %}
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="/">
      <span class="mark">{{ icon('scales', 'ic') }}</span>
      <span class="name">{{ site_name }}</span>
    </a>
    <nav>
      <a class="fav-link" href="/akty" aria-label="Akty prawne">{{ icon('scales', 'ic') }} <span class="lbl">Akty prawne</span></a>
      <a class="fav-link" href="/ulubione" aria-label="Ulubione">{{ icon('heart', 'ic') }} <span class="lbl">Ulubione</span>
        <span class="count" data-fav-count hidden>0</span></a>
      {% block nav_extra %}{% endblock %}
      <button class="theme-toggle" type="button" data-theme-toggle title="Przełącz jasny/ciemny motyw" aria-label="Przełącz jasny/ciemny motyw">
        {{ icon('sun', 'ic sun') }}{{ icon('moon', 'ic moon') }}
      </button>
    </nav>
  </div>
</header>

<main>{% block content %}{% endblock %}</main>

<footer class="footer">
  <div class="wrap">
    <p>Serwis nieoficjalny; źródłem prawa pozostaje treść oryginalna.</p>
  </div>
</footer>

<script src="/static/app.js" defer></script>
</body>
</html>
