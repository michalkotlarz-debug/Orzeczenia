name: archiwum-ms

# Cyklicznie dogrywa kolejną porcję pełnego archiwum orzeczeń sądów powszechnych
# (ncourt-api) wprost do bazy Postgres (Neon) używanej przez aplikację - żeby
# to działało samo, bez włączonego komputera i bez zużywania tokenów na
# ręczne uruchamianie. Stan "co już mamy" trzyma się w bazie (known_ids), więc
# każdy przebieg sam wznawia się tam, gdzie skończył poprzedni - nie ma tu
# żadnego pliku/kursora do pilnowania między uruchomieniami.
#
# Wymaga sekretu DATABASE_URL w ustawieniach repozytorium
# (Settings -> Secrets and variables -> Actions -> New repository secret) -
# ten sam connection string co w Vercelu (Neon).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Ile NOWYCH orzeczeń pobrać w tym przebiegu"
        default: "150"

concurrency:
  group: archiwum-ms
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # 150 nowych dokumentow to 2 zadania HTTP kazdy (details+content), ~1,2-2s
    # odstepu miedzy zadaniami do tego samego hosta (limiter) - w praktyce
    # zaobserwowano ok. 23 min na pelna porcje 150. Przy 25-min limicie polowa
    # przebiegow byla ucinana tuz przed koncem (##[error]The operation was
    # canceled) - podniesione z zapasem, zeby konczyc sie normalnie.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Importuj kolejną porcję archiwum
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m orzeczenia.cli importuj-ms --full \
            --limit "${{ github.event.inputs.limit || '150' }}"
