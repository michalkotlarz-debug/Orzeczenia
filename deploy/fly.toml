# Wdrożenie na Fly.io:  fly launch --copy-config --config deploy/fly.toml
app = "orzecznik"
primary_region = "waw"          # Warszawa - blisko portali źródłowych

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[env]
  TZ = "Europe/Warsaw"
