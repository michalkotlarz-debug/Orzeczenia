name: admin-cli

# NIEAKTUALNE od migracji na VPS (patrz STAN-INFRASTRUKTURY.md) - baza
# produkcyjna to teraz PostgreSQL lokalny na VPS (127.0.0.1), nieosiagalny
# z GitHub Actions. Sekret DATABASE_URL ponizej wskazuje na juz skasowana
# baze Neon. Do jednorazowych operacji administracyjnych na produkcji uzyj
# zamiast tego SSH na VPS: `sudo docker exec orzecznik python -m
# orzeczenia.cli ...`. Zostawione jako szablon/dokumentacja, nie do uruchamiania.
#
# Oryginalny opis: ogólny "właz serwisowy" - ręczne uruchomienie dowolnego
# istniejącego polecenia `orzeczenia.cli` na produkcyjnej bazie (patrz
# `pokaz`, `scal-recznie`, `scal-duplikaty`, `baza`).

on:
  workflow_dispatch:
    inputs:
      args:
        description: "Argumenty dla `python -m orzeczenia.cli ...` (np. \"pokaz KEEP1 --source ms\")"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Uruchom polecenie
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m orzeczenia.cli ${{ github.event.inputs.args }}
