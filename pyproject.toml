[project]
name = "orzecznik"
version = "2.0.0"
description = "Wyszukiwarka orzeczen sadow powszechnych i KIO - odpytuje portale zrodlowe na zywo, bez wlasnej bazy"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "typer>=0.12",
    # Sterownik PostgreSQL - potrzebny TYLKO wtedy, gdy DATABASE_URL wskazuje
    # Postgresa (Neon / Supabase / Railway). Przy SQLite nie jest w ogole importowany.
    "psycopg[binary]>=3.1",
]

[project.scripts]
orzecznik = "orzeczenia.cli:app"

[tool.setuptools.packages.find]
include = ["orzeczenia*"]
